name: Tests backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    # securite.md BD-9 : les tests tournent sur une base PostgreSQL jetable, jamais sur la production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installe les dependances
        run: pip install -r todo-app/backend/requirements.txt

      - name: Lance les tests
        run: pytest todo-app/backend/
        env:
          # Valeurs factices : les tests n'appellent ni Mailjet, ni Gemini, ni les services push
          DATABASE_URL: postgresql://todo:todo@localhost:5432/todo_test
          SECRET_KEY: cle-de-test-uniquement-pour-la-ci-0123456789abcdef
          MAILJET_API_KEY: test
          MAILJET_SECRET_KEY: test
          MAIL_FROM: test@example.com
          FRONTEND_URL: https://todo.example.com
          VAPID_PRIVATE_KEY: test
          VAPID_PUBLIC_KEY: test
          CRON_SECRET: secret-cron-de-test
          GEMINI_API_KEY: test
          ADMIN_USERNAME: admin_test
