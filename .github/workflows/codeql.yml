name: Analyse de securite CodeQL

on:
  push:
    branches: [main]
    paths: ["antivirus/**"]
  pull_request:
    branches: [main]
    paths: ["antivirus/**", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
          config: |
            paths: [antivirus]

      - uses: github/codeql-action/analyze@v3
