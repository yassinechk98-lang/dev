name: Analyse de securite CodeQL

on:
  push:
    branches: [main]
    paths: ["antivirus/**"]
  pull_request:
    branches: [main]
    paths: ["antivirus/**", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: python
          queries: security-extended
          config: |
            paths: [antivirus]

      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
