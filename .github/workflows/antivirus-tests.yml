name: Tests antivirus

on:
  push:
    branches: [main]
    paths: ["antivirus/**"]
  pull_request:
    branches: [main]
    paths: ["antivirus/**", ".github/workflows/antivirus-tests.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antivirus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installe les dependances
        run: pip install -r requirements-dev.txt

      - name: Lance les tests
        run: pytest
