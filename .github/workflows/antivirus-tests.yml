name: Tests antivirus

on:
  push:
    branches: [main]
    paths: ["antivirus/**"]
  pull_request:
    branches: [main]
    paths: ["antivirus/**", ".github/workflows/antivirus-tests.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antivirus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Installe les dependances
        run: pip install --require-hashes -r requirements-build.txt

      - name: Lance les tests
        run: pytest
